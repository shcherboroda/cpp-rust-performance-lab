[package]
name = "low-latency-lab-benchmarks"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
futures-util = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
panic = "unwind"

[[bin]]
name = "sequential_sum"
path = "src/bin/sequential_sum.rs"

[[bin]]
name = "native_mixed_lifecycle"
path = "src/bin/native_mixed_lifecycle.rs"

